apiVersion: apps/v1
kind: Deployment
metadata:
  name: course-catalog
  namespace: student-registration
spec:
  replicas: 1
  selector:
    matchLabels:
      app: course-catalog
  template:
    metadata:
      labels:
        app: course-catalog
    spec:
      containers:
        - name: course-catalog
          image: course-catalog:1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          env:
            - name: DATABASE_URL
              value: sqlite:////app/data/catalog.db
          volumeMounts:
            - name: catalog-data
              mountPath: /app/data
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
      volumes:
        - name: catalog-data
          persistentVolumeClaim:
            claimName: catalog-data-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: course-catalog
  namespace: student-registration
spec:
  type: ClusterIP
  selector:
    app: course-catalog
  ports:
    - port: 8000
      targetPort: 8000
